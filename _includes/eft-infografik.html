{%- comment -%}
  EFT-infografiken. Texterna finns i _data/eft.yml.
  Knackpunkternas etiketter och deras placering på bilden är kod och ska inte ändras här.
{%- endcomment -%}
{% assign e = site.data.eft %}
<figure class="eft-info">
  <div class="eft-info-head">
    <p class="eft-info-title"><span class="eft-info-eft">{{ e.rubrik }}</span> <span class="eft-info-sub">{{ e.undertitel }}</span> <span class="eft-info-script">{{ e.tapping }}</span></p>
    <p class="eft-info-lead">{{ e.valkomsttext }}</p>
  </div>
  <div class="eft-info-cols">
    <section>
      <h5>{{ e.vad_ar_rubrik }}</h5>
      <p>{{ e.vad_ar }}</p>
    </section>
    <section>
      <h5>{{ e.hur_rubrik }}</h5>
      <p>{{ e.hur }}</p>
    </section>
  </div>
  <div class="eft-info-main">
    <div class="eft-info-fig">
      <p class="eft-info-hand">{{ e.handskrift_figur }}</p>
      {% include eft-figur-svg.html %}
    </div>
    <aside class="eft-info-steps">
      <h5>{{ e.steg_rubrik }}</h5>
      <ul>
        {% for s in e.steg %}<li>{{ s }}</li>
        {% endfor %}
      </ul>
      <p class="eft-info-hand">{{ e.handskrift_steg }}</p>
    </aside>
  </div>
  <p class="eft-info-foot">♡ {{ e.fot }}</p>
</figure>
