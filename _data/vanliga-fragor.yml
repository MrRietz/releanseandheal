- fraga: Hur kommer jag igång?
  svar: 'Du bokar ett utforskande samtal på 30 minuter, det är gratis. Där berättar du vad du önskar hjälp med och jag lyssnar in hur jag bäst kan hjälpa dig. Därefter bokar vi in första sessionen.'
- fraga: Sker det på distans eller på plats?
  svar: 'Främst på distans via videosamtal, men det finns även möjlighet till fysiska träffar i Veberöd.'
- fraga: Hur många sessioner behöver jag?
  svar: 'Det varierar beroende på vad vi arbetar med. Vi pratar om det i det utforskande samtalet.'
- fraga: Hur betalar jag?
  svar: 'Betalning sker innan behandling via swish eller bankkonto. Jag innehar F-skattsedel och är medlem i Friskvårdsförbundet samt Reikiförbundet.'
- fraga: Är det konfidentiellt?
  svar: 'Ja. Allt som kommer upp under behandling är konfidentiellt och jag arbetar under tystnadsplikt.'
- fraga: Vad får jag efter en Emotion Code-behandling på distans?
  svar: 'Du får en rapport över vilka emotioner som frigjorts.'
