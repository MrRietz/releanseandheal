- rubrik: Utforskande samtal
  text: '30 minuter, gratis. Du berättar vad du önskar hjälp med och jag lyssnar in hur jag bäst kan hjälpa dig.'
- rubrik: Första sessionen
  text: 'Vi bokar in den utifrån dina behov, på distans eller i Veberöd.'
- rubrik: Fortsättning
  text: 'Antal sessioner varierar beroende på vad vi arbetar med.'
