# Texterna i EFT-infografiken (visas i rutan "Läs mer" på EFT-kortet).
rubrik: EFT
undertitel: (Emotional Freedom Technique)
tapping: – Tapping
valkomsttext: Välkommen att prova på och upplev ett inre skifte.

vad_ar_rubrik: Vad är EFT?
vad_ar: EFT är en enkel och effektiv metod som kombinerar lätt knackning på specifika punkter på kroppen med att du fokuserar på det som känns jobbigt. Genom att stimulera energisystemet i kroppen kan EFT hjälpa dig att minska stress, lugna ner känslor och skapa mer balans och välbefinnande.

hur_rubrik: Hur fungerar det?
hur: När vi upplever stress, oro eller obehag hamnar kroppen i ett slags larmtillstånd. Genom att knacka på vissa punkter (akupressurpunkter) samtidigt som vi fokuserar på det vi vill förändra, kan vi hjälpa kroppen att slappna av och återgå till sitt naturliga lugn.

handskrift_figur: En liten knack – kan göra stor skillnad!

steg_rubrik: "Så här gör du:"
steg:
  - Använd pek- och långfinger för att knacka med.
  - Knacka med en eller båda händernas fingrar.
  - Knacka på varje punkt 10–15 gånger.
handskrift_steg: Det är enkelt, skonsamt och du kan göra det själv!

fot: Mindfulla verktyg · Mindre stress · Mer lugn · Ökat välbefinnande
